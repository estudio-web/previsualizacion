<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soporte IA Premium | IN-STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --primary: #ff7a00;
    --primary-hover: #e06b00;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --msg-user: #ff7a00;
    --msg-bot: #334155;
    --border: #475569;
  }

  * {
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    margin: 0;
    background-color: var(--bg-main);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }

  @media (min-width: 640px) {
    .app {
      height: 85vh;
      border-radius: 24px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
  }

  header {
    padding: 20px;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar-status {
    position: relative;
    width: 40px;
    height: 40px;
    background: rgba(255, 122, 0, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--primary);
  }

  .avatar-status::after {
    content: '';
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    background: #10b981;
    border: 2px solid var(--bg-card);
    border-radius: 50%;
  }

  .header-info {
    flex: 1;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  header p {
    margin: 2px 0 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  .chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* Custom Scrollbar */
  .chat::-webkit-scrollbar {
    width: 6px;
  }
  .chat::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
  }

  .msg {
    padding: 14px 18px;
    border-radius: 18px;
    max-width: 85%;
    line-height: 1.5;
    font-size: 15px;
    animation: fadeIn 0.3s ease-out forwards;
    word-break: break-word;
  }

  .user {
    background: var(--msg-user);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(255, 122, 0, 0.2);
  }

  .bot {
    background: var(--msg-bot);
    color: var(--text-main);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: rgba(30, 41, 59, 0.9);
    border-top: 1px solid var(--border);
  }

  .input-wrapper {
    position: relative;
    flex: 1;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: white;
    font-size: 15px;
    transition: all 0.2s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.15);
  }

  input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  button {
    border: none;
    background: var(--primary);
    color: white;
    padding: 0 20px;
    border-radius: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  button:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  /* Loader Animado CSS */
  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 6px 4px;
    align-items: center;
  }

  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1.0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar-status">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff7a00" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2z"/><path d="M12 6v6l4 2"/></svg>
    </div>
    <div class="header-info">
      <h1>Soporte IN-STORE</h1>
      <p>Asistente Virtual Activo</p>
    </div>
  </header>

  <div id="chat" class="chat">
    <div class="msg bot">Hola 👋, soy el asistente inteligente de IN-STORE. ¿En qué te puedo ayudar hoy?</div>
  </div>

  <div class="form">
    <div class="input-wrapper">
      <input id="message" placeholder="Escribí tu consulta..." maxlength="1000" autocomplete="off">
    </div>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwM5dJmva__H9jAchTv3EFbQ7FmvxnaAR1enomditproS3QRAgjWfuryehNh7JgYMHl/exec";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

// Habilita/Deshabilita botón según el texto
input.addEventListener("input", () => {
  sendBtn.disabled = !input.value.trim();
});
sendBtn.disabled = true; // Estado inicial

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  // Renderizar mensaje de usuario
  addMessage(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  
  // Bloquear input temporalmente
  input.disabled = true;

  // Agregar indicador de escritura pro
  const loadingDiv = addLoadingIndicator();
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    loadingDiv.remove(); // Quitamos los puntitos animados

    // Efecto de escritura pro para la respuesta
    const botMsgDiv = addMessage("", "bot");
    typeWriterEffect(botMsgDiv, data.reply || "No recibí respuesta del servidor.");

  } catch(e) {
    loadingDiv.remove();
    const errorDiv = addMessage("⚠️ No pude conectar con el soporte IA. Por favor, reintentá.", "bot");
    errorDiv.style.borderColor = "#ef4444";
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = `msg ${type}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addLoadingIndicator() {
  const div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
  return div;
}

// Simula la escritura fluida de las IA modernas (Streaming effect)
// Simula escritura fluida tipo IA moderna
function typeWriterEffect(element, text) {

  let index = 0;

  function type() {

    if(index < text.length){

      element.textContent += text.charAt(index);

      index++;

      chat.scrollTop = chat.scrollHeight;

      setTimeout(type, 8);

    }

  }

  type();

}

// Enter para enviar
input.addEventListener("keydown", e => {

  if(e.key === "Enter" && !input.disabled){

    sendMessage();

  }

});
</script>

</body>
</html>
